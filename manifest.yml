modules:
  jira:issueContext:
    - key: app-issue-panel
      resource: main
      resolver:
        function: resolver
      title: User Context
      label: Custom UI

  jira:adminPage:
    - key: app-admin-page
      title: App Configuration
      resource: main
      resolver:
        function: admin-resolver

  consumer:
    - key: jira-projects-queue
      queue: jira-projects-queue
      function: processJiraQueue


  function:
    - key: resolver
      handler: index.handler
    - key: admin-resolver
      handler: index.adminHandler
    - key: processJiraQueue
      handler: index.processJiraQueue
      timeoutSeconds: 900

resources:
  - key: main
    path: static/hello-world/build
  - key: modal
    path: static/modal
app:
  storage:
    entities:
      - name: app_settings
        attributes:
          allowedProjects:
            type: any
          selectedFields:
            type: any
      - name: project_cache
        attributes:
          startAt:
            type: integer
          projects:
            type: any
          isLast:
            type: boolean
          fetchedAt:
            type: string
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/06e9ee2c-0bf8-48e1-bb37-a809ec1b81d7
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app
